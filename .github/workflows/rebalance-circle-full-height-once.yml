name: Rebalance Circle full height once

on:
  push:
    branches:
      - fix/circle-a4-full-height-balance
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/circle-a4-full-height-balance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply full-height rebalance
        run: node tools/rebalance-circle-full-height-once.mjs
      - name: Static verification
        run: |
          node circle/qa.mjs
          git diff --check
      - name: Commit rebalance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add circle/styles.css circle/a4-utilization.css tools/qa-a4-pages.mjs
          git commit -m 'Balance Circle pages through full usable A4 height'
          git push origin HEAD:fix/circle-a4-full-height-balance
