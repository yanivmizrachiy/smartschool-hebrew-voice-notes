name: Sync textbook fill once

on:
  push:
    paths:
      - src/build.mjs
      - worksheets/textbook-layout.css

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/textbook-layout-46-pages-20260813
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync sources and print bundle
        run: |
          npm run build
          npm run build:print
          npm run validate
      - name: Commit synchronized outputs and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worksheets print
          git rm .github/workflows/sync-textbook-fill-once.yml
          git commit -m "Sync audited textbook page-fill layout"
          git push origin HEAD:audit/textbook-layout-46-pages-20260813
