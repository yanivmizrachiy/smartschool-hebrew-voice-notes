name: Math writing normalization once

on:
  push:
    branches: [agent/math-writing-audit]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/math-writing-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize only audited mathematical-writing patterns
        run: node tools/normalize-math-writing.mjs
      - name: Verify source-locked page remains unchanged
        run: node tests/source-locked.mjs
      - name: Verify patch hygiene
        run: |
          git diff --check
          test -z "$(git diff --name-only | grep -vE '^(worksheets/page-[0-9]+\.html|circle/page-(50|51)\.html)$' || true)"
          ! git diff --name-only | grep -q '^worksheets/page-17\.html$'
      - name: Commit normalized source pages
        run: |
          if git diff --quiet -- worksheets circle/page-50.html circle/page-51.html; then
            echo 'No normalization changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worksheets circle/page-50.html circle/page-51.html
          git commit -m 'Normalize mathematical writing across workbook pages'
          git push origin HEAD:agent/math-writing-audit
