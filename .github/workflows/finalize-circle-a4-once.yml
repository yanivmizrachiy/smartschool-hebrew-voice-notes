name: Finalize Circle A4 once

on:
  push:
    branches:
      - fix/circle-no-name-date-a4-utilization
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/circle-no-name-date-a4-utilization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final Circle A4 patch
        run: node .github/scripts/finalize-circle-a4-once.cjs
      - name: Verify patch
        run: |
          node circle/qa.mjs
          git diff --check
          grep -F 'aria-label="עמוד 74"' circle/page-74.html
          grep -F 'Final measured residual tuning' circle/a4-utilization.css
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add circle/page-7*.html circle/a4-utilization.css circle/qa.mjs
          git commit -m 'Finalize Circle A4 utilization and page labels'
          git push origin HEAD:fix/circle-no-name-date-a4-utilization
