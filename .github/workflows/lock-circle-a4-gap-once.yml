name: Lock Circle A4 gap threshold once

on:
  push:
    branches:
      - fix/circle-a4-utilization-final
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/circle-a4-utilization-final
          fetch-depth: 0
      - name: Normalize A4 utilization thresholds
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/qa-a4-pages.mjs')
          s = p.read_text()
          old1 = "const EXTREME_UNUSED_GAP_PX = 260;\nconst WARN_UNUSED_GAP_PX = 150;"
          new1 = "const UNUSED_GAP_LIMIT_PX = Object.freeze({ circle: 150, cylinder: 260 });\nconst WARN_UNUSED_GAP_PX = 150;"
          old2 = "  const circleUnusedGapLimit = WARN_UNUSED_GAP_PX;\n  const unusedGapLimit = book === 'circle' ? circleUnusedGapLimit : EXTREME_UNUSED_GAP_PX;"
          new2 = "  const unusedGapLimit = UNUSED_GAP_LIMIT_PX[book];"
          if old1 not in s:
              raise SystemExit('threshold constants anchor not found')
          if old2 not in s:
              raise SystemExit('threshold selection anchor not found')
          s = s.replace(old1, new1).replace(old2, new2)
          p.write_text(s)
          PY
          grep -F "circle: 150, cylinder: 260" tools/qa-a4-pages.mjs
          grep -F "const unusedGapLimit = UNUSED_GAP_LIMIT_PX[book];" tools/qa-a4-pages.mjs
      - name: Remove one-time workflow and commit
        run: |
          git rm .github/workflows/lock-circle-a4-gap-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/qa-a4-pages.mjs
          git diff --check
          git commit -m 'Lock Circle A4 unused-space threshold at 150px'
          git push origin HEAD:fix/circle-a4-utilization-final
