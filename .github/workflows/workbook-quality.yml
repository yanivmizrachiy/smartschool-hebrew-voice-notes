name: Cone workbook quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync generated worksheet and visual chrome
        run: npm run build
      - name: Build A4 print bundle
        run: npm run build:print
      - name: Validate workbook contracts
        run: npm run validate
      - name: Ensure generated booklet sources stayed synchronized
        run: git diff --exit-code -- worksheets visual-pages print content src tests package.json
      - name: Verify print bundle exists
        run: test -s print/harut-a4.html && test -s print/styles.css
