name: Workbook quality

on:
  push:
    branches: [main, feat/circle-cylinder-isolated-workbooks]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbook-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked Node dependencies
        run: npm ci
      - name: Audit Node dependencies
        run: npm audit --audit-level=high
      # Numbering follows the razpages rule: one topic-local page number, never the internal worksheet id.
      - name: Validate generated source synchronization without mutation
        run: npm run build
      - name: Build cone A4 print bundle
        run: npm run build:print
      - name: Verify deterministic print build
        run: node tests/build-reproducibility.mjs
      - name: Validate cone workbook contracts
        run: npm run validate
      - name: Validate property-based geometry invariants
        run: node tests/math-properties.mjs
      - name: Validate circle workbook contracts
        run: node circle/qa.mjs
      - name: Validate cylinder workbook contracts
        run: node cylinder/qa.mjs
      - name: Validate circle and cylinder content quality
        run: node tools/qa-workbook-content.mjs
      - name: Audit mathematical writing across all 172 A4 pages
        run: node tools/qa-math-writing.mjs
      - name: Upload mathematical writing audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathematical-writing-audit
          path: qa/math-writing/*
          if-no-files-found: warn
          retention-days: 14
      - name: Audit full-page raster source quality
        run: node tools/qa-visual-assets.mjs
      - name: Upload visual asset readiness status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-asset-readiness
          path: qa/visual-assets/status.json
          if-no-files-found: error
          retention-days: 30
      - name: Validate shared mobile viewer contract
        run: node viewer/qa.mjs
      - name: Start local workbook server
        run: |
          python3 -m http.server 4173 >/tmp/workbook-http.log 2>&1 &
          echo $! > /tmp/workbook-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          cat /tmp/workbook-http.log
          exit 1
      - name: Run real shared-home browser QA
        run: node tools/qa-shared-home.mjs
      - name: Upload shared-home screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-home-qa
          path: qa/shared-home/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Run real A4 browser QA for all circle and cylinder pages
        run: node tools/qa-a4-pages.mjs
      - name: Upload A4 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a4-workbook-qa
          path: qa/a4-pages/*
          if-no-files-found: warn
          retention-days: 7
      - name: Run real mobile browser QA
        run: node tools/qa-mobile-viewer.mjs
      - name: Upload mobile QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-viewer-qa
          path: qa/mobile-viewer/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Run canonical real PDF print QA
        run: node tools/qa-print-booklets.mjs
      - name: Verify generated print PDFs
        run: |
          test -s qa/print-booklets/cone-46-pages.pdf
          test -s qa/print-booklets/circle-88-pages.pdf
          test -s qa/print-booklets/cylinder-38-pages.pdf
      - name: Record canonical PDF fingerprints
        run: node tools/qa-pdf-fingerprints.mjs
      - name: Upload real PDF QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: print-booklets-qa
          path: qa/print-booklets/*
          if-no-files-found: warn
          retention-days: 7
      - name: Build isolated deployment artifact
        run: node src/build-site.mjs
      - name: Validate isolated deployment artifact
        run: node tests/dist-contract.mjs
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: verified-site-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload canonical build fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: build-fingerprint
          path: dist/build-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Ensure generated artifacts stayed synchronized
        run: git diff --exit-code -- worksheets visual-pages print content src tests package.json package-lock.json
      - name: Verify cone print bundle exists
        run: test -s print/harut-a4.html && test -s print/styles.css
