name: Cone PR write probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cone-final-png-ready-20260824
      - name: Prove write permission and self-clean
        run: |
          set -euo pipefail
          mkdir -p .asset-staging
          printf 'GitHub Actions PR contents:write verified\n' > .asset-staging/pr-write-probe-ok.txt
          rm .github/workflows/cone-pr-write-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .asset-staging/pr-write-probe-ok.txt .github/workflows/cone-pr-write-probe.yml
          git commit -m 'Verify PR Actions write permission for cone asset import'
          git push origin HEAD:fix/cone-final-png-ready-20260824
