name: Remove unrequested generator edits once

on:
  push:
    branches:
      - fix/math-notation-and-page5-20260814
    paths:
      - .github/workflows/remove-unrequested-generator-edits-once.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/math-notation-and-page5-20260814
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore content that was not requested
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:worksheets/page-1.html > worksheets/page-1.html
          git show origin/main:worksheets/page-20.html > worksheets/page-20.html
          node <<'NODE'
          const fs = require('fs');
          for (const file of ['worksheets/page-18.html','worksheets/page-26.html','worksheets/page-32.html']) {
            let s = fs.readFileSync(file, 'utf8');
            s = s.replaceAll('קו היוצר', 'היוצר').replaceAll('קו יוצר', 'יוצר');
            fs.writeFileSync(file, s);
          }
          const testPath = 'tests/math-correctness.mjs';
          let t = fs.readFileSync(testPath, 'utf8');
          t = t.replace(/\n\/\/ The six concepts shown[\s\S]*?\n\/\/ Middle-school notation contract:/, '\n// Middle-school notation contract:');
          fs.writeFileSync(testPath, t);
          NODE
      - name: Remove this one-time workflow before validation
        run: rm .github/workflows/remove-unrequested-generator-edits-once.yml
      - name: Rebuild and validate
        run: |
          npm run build
          npm run build:print
          npm run validate
      - name: Commit clean scope
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove unrequested generator terminology edits"
          git push origin HEAD:fix/math-notation-and-page5-20260814
