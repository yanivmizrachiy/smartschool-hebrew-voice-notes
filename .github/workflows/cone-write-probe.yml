name: Cone write-permission probe

on:
  push:
    branches:
      - fix/cone-final-png-ready-20260824
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cone-final-png-ready-20260824
      - name: Prove branch write permission and self-remove probe
        run: |
          set -euo pipefail
          mkdir -p .asset-staging
          printf 'GitHub Actions contents:write verified\n' > .asset-staging/write-probe-ok.txt
          rm .github/workflows/cone-write-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .asset-staging/write-probe-ok.txt .github/workflows/cone-write-probe.yml
          git commit -m 'Verify Actions write permission for cone asset import'
          git push origin HEAD:fix/cone-final-png-ready-20260824
# trigger 2026-08-25
