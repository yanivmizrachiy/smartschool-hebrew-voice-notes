name: Tune Circle full-height exceptions once

on:
  push:
    branches:
      - fix/circle-a4-full-height-balance
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/circle-a4-full-height-balance
          fetch-depth: 0
      - name: Add measured dense-page exceptions
        shell: bash
        run: |
          cat >> circle/a4-utilization.css <<'CSS'

          /* Full-height dense-page exceptions — measured */
          /* These four pages already use the lower A4 area densely enough without flex distribution. */
          .a4-page:has(.page-number[aria-label="עמוד 47"]),
          .a4-page:has(.page-number[aria-label="עמוד 57"]),
          .a4-page:has(.page-number[aria-label="עמוד 83"]),
          .a4-page:has(.page-number[aria-label="עמוד 85"]){display:block}

          .a4-page:has(.page-number[aria-label="עמוד 47"]) > .anchor,
          .a4-page:has(.page-number[aria-label="עמוד 57"]) > .anchor,
          .a4-page:has(.page-number[aria-label="עמוד 83"]) > .anchor,
          .a4-page:has(.page-number[aria-label="עמוד 85"]) > .anchor{margin:5mm 0 4mm!important}

          .a4-page:has(.page-number[aria-label="עמוד 57"]) > .task,
          .a4-page:has(.page-number[aria-label="עמוד 83"]) > .task,
          .a4-page:has(.page-number[aria-label="עמוד 85"]) > .task{margin:2.7mm 0!important}
          .a4-page:has(.page-number[aria-label="עמוד 47"]) > .task{margin:5.3mm 0!important}

          /* Page 57 measured 71px unused in the pre-flex layout; slightly taller real table rows reclaim ~3.5mm. */
          .a4-page:has(.page-number[aria-label="עמוד 57"]) .work-table th,
          .a4-page:has(.page-number[aria-label="עמוד 57"]) .work-table td{padding-block:2.55mm!important}
          CSS
      - name: Verify static contracts
        run: |
          node circle/qa.mjs
          git diff --check
      - name: Commit targeted exceptions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add circle/a4-utilization.css
          git commit -m 'Tune dense Circle pages for full-height A4 balance'
          git push origin HEAD:fix/circle-a4-full-height-balance
