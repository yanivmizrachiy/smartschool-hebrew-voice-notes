name: Sync generated print once

on:
  push:
    branches: [agent/math-writing-audit]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/math-writing-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild canonical cone outputs
        run: |
          npm run build
          npm run build:print
      - name: Verify generated diff scope
        run: |
          git diff --check
          CHANGED="$(git diff --name-only)"
          echo "$CHANGED"
          test "$CHANGED" = "print/harut-a4.html"
      - name: Verify source lock and workbook mathematics
        run: |
          node tests/source-locked.mjs
          node tests/math-correctness.mjs
          node tests/booklet-contract.mjs
          node circle/qa.mjs
          node cylinder/qa.mjs
          node tools/qa-workbook-content.mjs
          node tools/qa-math-writing.mjs
      - name: Commit generated print bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add print/harut-a4.html
          git commit -m 'Sync generated cone print bundle after math audit'
          git push origin HEAD:agent/math-writing-audit
