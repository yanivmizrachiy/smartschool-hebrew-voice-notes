name: Modern browser QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modern-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked project dependencies
        run: npm ci
      - name: Install pinned modern browser QA tooling
        run: npm install --no-save --package-lock=false playwright@1.62.1 @axe-core/playwright@4.13.0 lighthouse@13.4.1
      - name: Install pinned Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Start local workbook server
        run: |
          python3 -m http.server 4173 >/tmp/modern-browser-http.log 2>&1 &
          echo $! > /tmp/modern-browser-http.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/modern-browser-http.log
          exit 1
      - name: Run Chromium Firefox WebKit and axe QA
        run: node tests/modern-browser-qa.mjs
      - name: Run Lighthouse on Home
        run: npx lighthouse http://127.0.0.1:4173/ --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=qa/modern-browser/lighthouse-home.json --quiet
      - name: Run Lighthouse on cone viewer shell
        run: npx lighthouse "http://127.0.0.1:4173/?topic=cone&sheet=1#workbook" --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=qa/modern-browser/lighthouse-viewer-cone.json --quiet
      - name: Enforce Lighthouse budgets
        run: node tests/lighthouse-budget.mjs
      - name: Upload modern browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-browser-qa
          path: qa/modern-browser/*
          if-no-files-found: error
          retention-days: 14
