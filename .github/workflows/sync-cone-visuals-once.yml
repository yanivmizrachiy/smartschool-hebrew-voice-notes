name: Sync cone 3D visuals once

on:
  push:
    branches: [fix/cone-3d-textbook-unification-20260813]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cone-3d-textbook-unification-20260813
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build synchronized workbook and print bundle
        run: |
          npm run build
          npm run build:print
      - name: Commit generated bundle and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worksheets visual-pages print
          git rm .github/workflows/sync-cone-visuals-once.yml
          git commit -m "Sync canonical 3D cone visuals into print bundle"
          git push origin HEAD:fix/cone-3d-textbook-unification-20260813
