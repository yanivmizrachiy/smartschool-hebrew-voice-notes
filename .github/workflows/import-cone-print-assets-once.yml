name: Import verified cone print assets once

on:
  push:
    branches: [fix/cone-print-visual-assets-20260824]

permissions:
  contents: write

jobs:
  import-assets:
    if: ${{ !contains(github.event.head_commit.message, '[assets-ready]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cone-print-visual-assets-20260824
          fetch-depth: 0

      - name: Download verified A4 PNG sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .asset-import
          download() {
            local id="$1" out="$2"
            curl --fail --location --retry 3 --retry-delay 2 \
              "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" \
              --output ".asset-import/${out}"
          }
          download "1wQPNuzR0fMOaGBBx6qrDHW5rlisxBps1" "anis-basics.png"
          download "1KyAPcf6KGY9rguQWJOk-WH9R_8LimHkm" "cone-in-my-head.png"
          download "1sXJ9kI9XqdCYDLcrPS3hP-Fy-h3G1zue" "world-of-cones.png"
          download "1pHJ47SBHMVu95s23JOwgbmnmIMuC5BxN" "jerusalem-cone-vision.png"

      - name: Verify source bytes and A4 dimensions
        shell: python
        run: |
          from pathlib import Path
          import struct
          expected = {
              'anis-basics.png': (1055, 1491),
              'cone-in-my-head.png': (1055, 1491),
              'world-of-cones.png': (1055, 1491),
              'jerusalem-cone-vision.png': (1055, 1491),
          }
          for name, dims in expected.items():
              p = Path('.asset-import') / name
              data = p.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', f'{name}: not PNG'
              width, height = struct.unpack('>II', data[16:24])
              assert (width, height) == dims, f'{name}: {(width,height)} != {dims}'
              assert len(data) > 2_000_000, f'{name}: unexpectedly small ({len(data)} bytes)'
              print(f'OK {name}: {width}x{height}, {len(data)} bytes')

      - name: Install print-quality assets and switch visual pages
        shell: python
        run: |
          from pathlib import Path
          mapping = {
              'anis-basics': 'anis-basics.png',
              'cone-in-my-head': 'cone-in-my-head.png',
              'world-of-cones': 'world-of-cones.png',
              'jerusalem-cone-vision': 'jerusalem-cone-vision.png',
          }
          assets = Path('visual-assets')
          pages = Path('visual-pages')
          for stem, filename in mapping.items():
              source = Path('.asset-import') / filename
              target = assets / filename
              target.write_bytes(source.read_bytes())
              page = pages / f'{stem}.html'
              html = page.read_text(encoding='utf-8')
              old = f'../visual-assets/{stem}.jpg'
              new = f'../visual-assets/{filename}'
              assert old in html, f'{page}: expected old asset reference missing'
              page.write_text(html.replace(old, new), encoding='utf-8')
              old_jpg = assets / f'{stem}.jpg'
              if old_jpg.exists():
                  old_jpg.unlink()

      - name: Remove one-time workflow from tested tree
        run: rm .github/workflows/import-cone-print-assets-once.yml

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Full build and validation
        run: npm run check

      - name: Render and verify all 46 A4 pages
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/cone-assets-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          npm run render:pages
          test "$(find qa/layout-pages -maxdepth 1 -name '*.png' | wc -l)" -eq 46

      - name: Commit verified assets and importer removal
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .asset-import qa/layout-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A visual-assets visual-pages .github/workflows
          git diff --cached --check
          git commit -m "[assets-ready] Replace tiny cone visuals with verified A4 sources"
          git push origin HEAD:fix/cone-print-visual-assets-20260824
