name: Apply page 2 textbook layout once

on:
  push:
    branches: [audit/textbook-layout-46-pages-20260813]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/textbook-layout-46-pages-20260813
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebalance page 2 without changing its mathematics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('worksheets/page-2.html')
          s=p.read_text()
          s=re.sub(r'<nav class="preview-nav"[\s\S]*?</nav>\s*','',s,1)
          s=s.replace('class="a4-page dense"','class="a4-page page-2-layout"')
          s=re.sub(r'<footer class="sheet-footer"[\s\S]*?</footer>','',s)
          anchor='<section class="q-card"><h3>מתאימים חלקים</h3>'
          panel='''<section class="q-card page-2-transition"><h3>מהפריסה אל הגוף</h3><div class="net-transition"><div><svg viewBox="0 0 260 120" role="img" aria-label="פריסה של חרוט: גזרת עיגול ועיגול בסיס"><path d="M18 103 A88 88 0 0 1 164 28 L92 101 Z" fill="#eaf7fb" stroke="#243044" stroke-width="2"/><circle cx="215" cy="68" r="30" fill="#fff" stroke="#243044" stroke-width="2"/></svg><b>גזרת עיגול + עיגול בסיס</b></div><span class="transition-arrow">←</span><div><svg viewBox="0 0 230 120" role="img" aria-label="חרוט תלת־ממדי שנוצר מן הפריסה"><image href="../visual-assets/cone-3d-upright.svg" x="28" y="-14" width="174" height="148" preserveAspectRatio="xMidYMid meet"/></svg><b>סוגרים מעטפת ומחברים בסיס</b></div></div></section>'''
          if 'page-2-transition' not in s:
              s=s.replace(anchor,panel+anchor,1)
          p.write_text(s)
          css=Path('worksheets/styles.css')
          c=css.read_text()
          marker='/* page-2 textbook layout */'
          rules='''\n/* page-2 textbook layout */\n.page-2-layout{font-size:12.6px}.page-2-layout .sheet-content{gap:8px}.page-2-layout .q-card{padding:9px 12px 10px}.page-2-layout .q-card h3{margin:-9px -12px 8px;padding:7px 11px 7px 31px}.page-2-layout .cols-2,.page-2-layout .cols-3{gap:9px}.page-2-layout .part-card{padding:7px}.page-2-layout .mini-figure{max-height:118px}.page-2-layout .net-figure{max-height:138px}.page-2-layout .draw-box{height:86px}.page-2-layout .answer-line{height:1.5em}.page-2-layout .net-transition{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:7px 10px;border:1px solid #b9d6df;border-radius:11px;background:#f2fafc;text-align:center}.page-2-layout .net-transition svg{display:block;width:100%;height:84px}.page-2-layout .net-transition b{font-size:11px;color:#526071}.page-2-layout .transition-arrow{font-size:28px;font-weight:800;color:#0e6785}\n'''
          if marker not in c:
              css.write_text(c+rules)
          PY
      - name: Build and validate all existing contracts
        run: |
          npm run build
          npm run build:print
          npm run validate
      - name: Commit synchronized page 2 and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worksheets/page-2.html worksheets/styles.css print
          git rm .github/workflows/apply-page2-textbook-layout-once.yml
          git commit -m "Rebalance page 2 as a full A4 textbook lesson"
          git push origin HEAD:audit/textbook-layout-46-pages-20260813
