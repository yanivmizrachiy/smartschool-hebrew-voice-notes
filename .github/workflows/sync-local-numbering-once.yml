name: Sync local numbering once

on:
  push:
    branches: [fix/razpages-local-numbering-20260813]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/razpages-local-numbering-20260813
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate synchronized booklet sources
        run: |
          npm run build
          npm run build:print
      - name: Commit generated sources and remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worksheets visual-pages print
          git rm .github/workflows/sync-local-numbering-once.yml
          git commit -m "Sync topic-local numbering into all 46 booklet pages"
          git push origin HEAD:fix/razpages-local-numbering-20260813
