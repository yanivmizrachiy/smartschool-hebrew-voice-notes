name: Apply Circle 150px lock once

on:
  push:
    branches:
      - fix/circle-utilization-150-lock
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/circle-utilization-150-lock
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final Circle utilization patch
        run: node .github/scripts/apply-circle-150-lock-once.cjs
      - name: Verify patch
        run: |
          node circle/qa.mjs
          node --check tools/qa-a4-pages.mjs
          git diff --check
          grep -F 'Circle 150px final utilization lock' circle/a4-utilization.css
          grep -F "book === 'circle' ? circleUnusedGapLimit" tools/qa-a4-pages.mjs
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add circle/a4-utilization.css tools/qa-a4-pages.mjs
          git commit -m 'Lock Circle A4 utilization at 150px'
          git push origin HEAD:fix/circle-utilization-150-lock
