name: Sync generated layout once

on:
  push:
    branches: [audit/textbook-layout-46-pages-20260813]
    paths:
      - .github/workflows/sync-generated-layout-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/textbook-layout-46-pages-20260813
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild generated workbook outputs
        run: |
          npm run build
          npm run build:print
          npm run validate
      - name: Commit generated outputs and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add print/styles.css print/harut-a4.html
          git rm .github/workflows/sync-generated-layout-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "Synchronize generated textbook layout output"
          git push origin HEAD:audit/textbook-layout-46-pages-20260813
