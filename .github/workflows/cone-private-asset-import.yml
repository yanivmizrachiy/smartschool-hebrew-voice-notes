name: Cone private asset import

on:
  pull_request:
    branches: [main]
    types: [edited]

permissions:
  contents: write

jobs:
  import:
    if: github.event.pull_request.number == 44 && contains(github.event.pull_request.body, 'IMPORT_CANVA_URL=')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cone-final-png-ready-20260824
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse allowlisted import request
        id: request
        shell: python
        run: |
          import os
          from urllib.parse import urlparse
          body = os.environ['PR_BODY']
          values = {}
          for line in body.splitlines():
              if '=' in line:
                  key, value = line.split('=', 1)
                  if key in {'IMPORT_CANVA_URL','IMPORT_TARGET','IMPORT_PIXEL_SHA'}:
                      values[key] = value.strip()
          missing = {'IMPORT_CANVA_URL','IMPORT_TARGET','IMPORT_PIXEL_SHA'} - values.keys()
          if missing:
              raise SystemExit(f'missing import fields: {sorted(missing)}')
          allowed = {
              'visual-assets/anis-basics.png',
              'visual-assets/cone-in-my-head.png',
              'visual-assets/world-of-cones.png',
              'visual-assets/jerusalem-cone-vision.png',
          }
          if values['IMPORT_TARGET'] not in allowed:
              raise SystemExit('target is not allowlisted')
          parsed = urlparse(values['IMPORT_CANVA_URL'])
          if parsed.scheme != 'https' or parsed.hostname != 'media.canva.com':
              raise SystemExit('source must be an HTTPS media.canva.com URL')
          if len(values['IMPORT_PIXEL_SHA']) != 64 or any(c not in '0123456789abcdef' for c in values['IMPORT_PIXEL_SHA']):
              raise SystemExit('pixel SHA must be lowercase SHA-256')
          out = os.environ['GITHUB_OUTPUT']
          with open(out, 'a', encoding='utf-8') as f:
              f.write(f"target={values['IMPORT_TARGET']}\n")
              f.write(f"pixel_sha={values['IMPORT_PIXEL_SHA']}\n")
          with open('/tmp/canva-url', 'w', encoding='utf-8') as f:
              f.write(values['IMPORT_CANVA_URL'])
      - name: Download candidate
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$(cat /tmp/canva-url)" --output /tmp/candidate
          test -s /tmp/candidate
      - name: Verify exact pixels and dimensions
        env:
          TARGET: ${{ steps.request.outputs.target }}
          PIXEL_SHA: ${{ steps.request.outputs.pixel_sha }}
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          python - <<'PY'
          from PIL import Image
          import hashlib, os, shutil
          src = '/tmp/candidate'
          target = os.environ['TARGET']
          expected = os.environ['PIXEL_SHA']
          with Image.open(src) as im:
              if im.size != (1055, 1491):
                  raise SystemExit(f'wrong dimensions: {im.size}')
              rgba = im.convert('RGBA').tobytes()
              digest = hashlib.sha256(rgba).hexdigest()
              print(f'RGBA_SHA256={digest}')
              if digest != expected:
                  raise SystemExit(f'pixel hash mismatch: {digest} != {expected}')
              if (im.format or '').upper() != 'PNG':
                  raise SystemExit(f'candidate is not PNG: {im.format}')
          os.makedirs(os.path.dirname(target), exist_ok=True)
          shutil.copyfile(src, target)
          print(f'VERIFIED_AND_COPIED={target}')
          PY
      - name: Commit verified asset
        env:
          TARGET: ${{ steps.request.outputs.target }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          git commit -m "Add verified final cone asset: $(basename "$TARGET")"
          git push origin HEAD:fix/cone-final-png-ready-20260824
