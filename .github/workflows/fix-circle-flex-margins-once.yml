name: Fix Circle flex margins once

on:
  push:
    branches:
      - fix/circle-a4-full-height-balance
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/circle-a4-full-height-balance
          fetch-depth: 0
      - name: Normalize direct-child margins for flex balance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('circle/a4-utilization.css')
          s=p.read_text()
          old='.a4-page>*{flex-shrink:0}'
          new='.a4-page>*{flex-shrink:0;margin-block:0!important}'
          if old not in s:
              raise SystemExit('balance selector anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify static contracts
        run: |
          node circle/qa.mjs
          git diff --check
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add circle/a4-utilization.css
          git commit -m 'Normalize Circle flex margins for full-height balance'
          git push origin HEAD:fix/circle-a4-full-height-balance
