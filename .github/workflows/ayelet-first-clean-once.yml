name: Ayelet first clean once

on:
  push:
    branches:
      - fix/ayelet-first-clean-20260814
    paths:
      - .github/workflows/ayelet-first-clean-once.yml

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ayelet-first-clean-20260814
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reorder Ayelet page without rebuilding worksheet sources
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const wbPath = 'content/workbook.json';
          const wb = JSON.parse(fs.readFileSync(wbPath, 'utf8'));
          const idx = wb.printSequence.findIndex(x => x.kind === 'worksheet' && x.id === 17);
          if (idx < 0) throw new Error('Ayelet source page page-17 missing from printSequence');
          const [ayelet] = wb.printSequence.splice(idx, 1);
          wb.printSequence.unshift(ayelet);
          if (wb.printSequence.length !== 46) throw new Error(`Expected 46 sheets, got ${wb.printSequence.length}`);
          fs.writeFileSync(wbPath, JSON.stringify(wb, null, 2) + '\n');

          const worksheetById = new Map(wb.pages.map(p => [p.id, p]));
          const visualBySlug = new Map((wb.visualPages || []).map(p => [p.slug, p]));
          for (const [index, item] of wb.printSequence.entries()) {
            const local = index + 1;
            let file;
            if (item.kind === 'worksheet') {
              const p = worksheetById.get(item.id);
              if (!p) throw new Error(`Unknown worksheet ${item.id}`);
              file = path.join('worksheets', `${p.slug}.html`);
            } else {
              const p = visualBySlug.get(item.slug);
              if (!p) throw new Error(`Unknown visual ${item.slug}`);
              file = path.join('visual-pages', `${p.slug}.html`);
            }
            let html = fs.readFileSync(file, 'utf8');
            if (item.kind === 'worksheet') {
              const rx = /<div class="page-number"[^>]*>\d+<\/div>/;
              if (!rx.test(html)) throw new Error(`Missing worksheet page number in ${file}`);
              html = html.replace(rx, `<div class="page-number" data-local-page-number="true" aria-label="עמוד ${local}">${local}</div>`);
            } else {
              const rx = /<div class="local-page-number"[^>]*>\d+<\/div>/;
              if (!rx.test(html)) throw new Error(`Missing visual page number in ${file}`);
              html = html.replace(rx, `<div class="local-page-number" data-local-page-number="true" aria-label="עמוד ${local}">${local}</div>`);
            }
            fs.writeFileSync(file, html);
          }

          const seqPath = 'research/BOOK-SEQUENCE-46.md';
          const lines = fs.readFileSync(seqPath, 'utf8').split(/\r?\n/);
          const rowIdx = lines.findIndex(line => /^\|\s*\d+\s*\|/.test(line) && line.includes('`page-17`'));
          if (rowIdx < 0) throw new Error('Ayelet row missing from BOOK-SEQUENCE-46.md');
          const ayeletRow = lines.splice(rowIdx, 1)[0];
          const sep = lines.findIndex(line => /^\|---:/.test(line));
          if (sep < 0) throw new Error('Sequence table header missing');
          lines.splice(sep + 1, 0, ayeletRow);
          let n = 0;
          for (let i = sep + 1; i < lines.length; i++) {
            if (/^\|\s*\d+\s*\|/.test(lines[i])) {
              n++;
              lines[i] = lines[i].replace(/^\|\s*\d+\s*\|/, `| ${n} |`);
            }
          }
          if (n !== 46) throw new Error(`Expected 46 documented sheets, got ${n}`);
          fs.writeFileSync(seqPath, lines.join('\n'));

          fs.writeFileSync('tests/ayelet-first.mjs', `import fs from 'node:fs';\nconst workbook = JSON.parse(fs.readFileSync('content/workbook.json', 'utf8'));\nconst first = workbook.printSequence?.[0];\nconst ayelet = workbook.pages?.find(page => page.sourceId === 'drive-cone-companion-ayelet');\nconst errors = [];\nif (!ayelet) errors.push('Ayelet source page missing');\nif (ayelet?.id !== 17) errors.push('Ayelet source page must remain page-17');\nif (!(first?.kind === 'worksheet' && first?.id === 17)) errors.push('Ayelet source page page-17 must be first in printSequence');\nif (workbook.printSequence?.length !== 46) errors.push('printSequence must remain exactly 46 sheets');\nif (errors.length) { for (const e of errors) console.error('- ' + e); process.exit(1); }\nconsole.log('OK: Ayelet source page is first of 46 sheets.');\n`);

          const pkgPath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          if (!pkg.scripts.validate.includes('tests/ayelet-first.mjs')) {
            pkg.scripts.validate = pkg.scripts.validate.replace('node tests/source-locked.mjs', 'node tests/source-locked.mjs && node tests/ayelet-first.mjs');
          }
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

          const rulesPath = 'RULES.md';
          let rules = fs.readFileSync(rulesPath, 'utf8');
          const invariant = '- דף המקור הנעול של איילת (`page-17`, `sourceId: drive-cone-companion-ayelet`) חייב להיות הפריט הראשון ב־`printSequence`; אין להזיזו ללא החלטה מפורשת.';
          if (!rules.includes('drive-cone-companion-ayelet`) חייב להיות הפריט הראשון')) rules += `\n${invariant}\n`;
          fs.writeFileSync(rulesPath, rules);
          NODE
      - name: Remove one-time workflow before hygiene validation
        run: rm .github/workflows/ayelet-first-clean-once.yml
      - name: Rebuild print bundle only and validate
        run: |
          npm run build:print
          npm run validate
      - name: Commit precise reorder
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Put Ayelet source page first without changing worksheet content"
          git push origin HEAD:fix/ayelet-first-clean-20260814
