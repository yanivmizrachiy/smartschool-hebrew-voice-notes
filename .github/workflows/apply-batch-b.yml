name: Apply final reasoning pages

on:
  push:
    paths:
      - tools/apply-page36-layout.py
      - tools/apply-page37-layout.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/textbook-layout-46-pages-20260813
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused textbook edits
        run: |
          python3 tools/apply-page36-layout.py
          python3 tools/apply-page37-layout.py
          npm run build
          npm run build:print
          npm run validate
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Expand final reasoning pages into full textbook workspaces
