name: Textbook layout render

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: textbook-layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked Node dependencies
        run: npm ci
      - name: Install pinned image fidelity tooling
        run: python3 -m pip install --disable-pip-version-check pillow==12.3.0
      - name: Build and validate workbook
        run: npm run check
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/harut-http.log 2>&1 &
          sleep 2
      - name: Fast render Ayelet source page
        run: RENDER_ONLY_INDEX=1 npm run render:pages
      - name: Verify Ayelet source render fidelity
        run: python3 tests/ayelet-render-fidelity.py
      - name: Render all A4 pages
        run: npm run render:pages
      - name: Verify exact render count
        run: test "$(find qa/layout-pages -maxdepth 1 -name '*.png' | wc -l)" -eq 46
      - name: Upload page renders
        uses: actions/upload-artifact@v4
        with:
          name: textbook-layout-pages
          path: qa/layout-pages/*.png
          if-no-files-found: error
          retention-days: 7
