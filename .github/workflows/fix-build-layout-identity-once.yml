name: Fix build layout identity once

on:
  push:
    branches:
      - fix/ayelet-first-clean-20260814
    paths:
      - .github/workflows/fix-build-layout-identity-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ayelet-first-clean-20260814
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make textbook-fill content-based instead of position-based
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'src/build.mjs';
          let s = fs.readFileSync(p, 'utf8');
          const old = `// Pages identified by the 46-page visual audit as under-filled after pedagogic edits.\n// This class only distributes existing content through the safe A4 work area; it does not alter mathematics.\nconst textbookFillLocalPages = new Set([17, 18, 20, 22, 23, 25, 26, 27, 29, 31, 34, 36, 39, 41]);`;
          const next = `// Worksheets identified by the 46-page visual audit as under-filled after pedagogic edits.\n// Keep this keyed by stable worksheet id, never by physical print position, so reordering the booklet cannot move layout treatment between worksheets.\nconst textbookFillWorksheetIds = new Set([24, 25, 26, 27, 28, 29, 30, 31, 32, 34, 35, 36, 37, 38]);`;
          if (!s.includes(old)) throw new Error('Expected position-based textbook-fill block not found');
          s = s.replace(old, next);
          s = s.replace('if (textbookFillLocalPages.has(localPage)) classSet.add(\'textbook-fill\');', 'if (textbookFillWorksheetIds.has(page.id)) classSet.add(\'textbook-fill\');');
          fs.writeFileSync(p, s);
          NODE
      - name: Remove one-time workflow before hygiene validation
        run: rm .github/workflows/fix-build-layout-identity-once.yml
      - name: Regenerate chrome and verify all contracts
        run: |
          npm run build
          npm run build:print
          npm run validate
          git add -A
          npm run build
          npm run build:print
          npm run validate
          git diff --exit-code -- worksheets visual-pages print content src tests package.json
      - name: Commit idempotent build fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep textbook layout treatment stable when booklet order changes"
          git push origin HEAD:fix/ayelet-first-clean-20260814
