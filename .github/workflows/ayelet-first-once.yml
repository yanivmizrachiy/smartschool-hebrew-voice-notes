name: Ayelet first once

on:
  push:
    branches:
      - fix/math-notation-and-page5-20260814
    paths:
      - .github/workflows/ayelet-first-once.yml

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/math-notation-and-page5-20260814
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Put Ayelet source page first
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const wbPath = 'content/workbook.json';
          const wb = JSON.parse(fs.readFileSync(wbPath, 'utf8'));
          const idx = wb.printSequence.findIndex(x => x.kind === 'worksheet' && x.id === 17);
          if (idx < 0) throw new Error('Ayelet source page page-17 is missing from printSequence');
          const [ayelet] = wb.printSequence.splice(idx, 1);
          wb.printSequence.unshift(ayelet);
          if (wb.printSequence.length !== 46) throw new Error(`Expected 46 sheets, got ${wb.printSequence.length}`);
          if (!(wb.printSequence[0].kind === 'worksheet' && wb.printSequence[0].id === 17)) throw new Error('Ayelet page is not first');
          fs.writeFileSync(wbPath, JSON.stringify(wb, null, 2) + '\n');

          const seqPath = 'research/BOOK-SEQUENCE-46.md';
          const lines = fs.readFileSync(seqPath, 'utf8').split(/\r?\n/);
          const rowIdx = lines.findIndex(line => /^\|\s*\d+\s*\|/.test(line) && line.includes('`page-17`'));
          if (rowIdx < 0) throw new Error('Ayelet row missing from BOOK-SEQUENCE-46.md');
          const ayeletRow = lines.splice(rowIdx, 1)[0];
          const headerSepIdx = lines.findIndex(line => /^\|---:/.test(line));
          if (headerSepIdx < 0) throw new Error('Sequence table header not found');
          lines.splice(headerSepIdx + 1, 0, ayeletRow);
          let physical = 0;
          for (let i = headerSepIdx + 1; i < lines.length; i++) {
            if (/^\|\s*\d+\s*\|/.test(lines[i])) {
              physical++;
              lines[i] = lines[i].replace(/^\|\s*\d+\s*\|/, `| ${physical} |`);
            }
          }
          if (physical !== 46) throw new Error(`Expected 46 documented rows, got ${physical}`);
          fs.writeFileSync(seqPath, lines.join('\n'));
          NODE
      - name: Rebuild generated workbook
        run: |
          npm run build
          npm run build:print
          npm run validate
      - name: Commit reordered workbook and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ayelet-first-once.yml
          git add content/workbook.json research/BOOK-SEQUENCE-46.md worksheets print index.html viewer print.html
          git commit -m "Put Ayelet source page first in cone workbook"
          git push origin HEAD:fix/math-notation-and-page5-20260814
