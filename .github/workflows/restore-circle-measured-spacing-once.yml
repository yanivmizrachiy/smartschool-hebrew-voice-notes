name: Restore Circle measured spacing once

on:
  push:
    branches:
      - fix/circle-a4-full-height-balance
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/circle-a4-full-height-balance
          fetch-depth: 0
      - name: Restore measured task spacing
        run: |
          cat >> circle/a4-utilization.css <<'CSS'

          /* Dense-page task spacing — restore measured page-specific values after flex opt-out. */
          .a4-page:has(.page-number[aria-label="עמוד 57"]) > .task{margin:4.2mm 0!important}
          .a4-page:has(.page-number[aria-label="עמוד 83"]) > .task{margin:6.5mm 0!important}
          .a4-page:has(.page-number[aria-label="עמוד 85"]) > .task{margin:7mm 0!important}
          CSS
      - name: Verify static contracts
        run: |
          node circle/qa.mjs
          git diff --check
      - name: Commit measured spacing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add circle/a4-utilization.css
          git commit -m 'Restore measured spacing on dense Circle pages'
          git push origin HEAD:fix/circle-a4-full-height-balance
