name: Temporary apply print polish
on:
  push:
    branches:
      - fix/pedagogy-visual-print-polish-20260813
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message != 'Apply footer logo and black-white print mode'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pedagogy-visual-print-polish-20260813
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copy existing district logo from angles project
        run: |
          mkdir -p assets
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/yanivmizrachiy/zaviyot-digital-workbook/main/public/logo.png -o assets/district-logo.png
          test -s assets/district-logo.png
      - name: Apply print polish
        run: node scripts/temp-print-polish.mjs
      - name: Commit branch changes
        run: |
          git config user.name "Yaniv Raz"
          git config user.email "yanivmiz77@gmail.com"
          git add assets/district-logo.png worksheets/styles.css visual-pages/visual.css print.html viewer/print.js viewer/print.css index.html viewer/app.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply footer logo and black-white print mode"
          git push origin HEAD:fix/pedagogy-visual-print-polish-20260813
