name: Rebalance circle A4 once

on:
  push:
    branches:
      - fix/circle-no-name-date-a4-utilization
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/circle-no-name-date-a4-utilization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply smart vertical rebalance
        run: node tools/rebalance-circle-a4-once.mjs
      - name: Verify static contracts
        run: |
          node circle/qa.mjs
          git diff --check
      - name: Commit rebalance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add circle/styles.css tools/qa-a4-pages.mjs
          git commit -m 'Rebalance Circle A4 vertical space across real content'
          git push origin HEAD:fix/circle-no-name-date-a4-utilization
