name: Tune Circle 74 and 77 once

on:
  push:
    branches:
      - fix/circle-utilization-150-lock
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/circle-utilization-150-lock
          fetch-depth: 0
      - name: Apply measured tuning
        run: node .github/scripts/tune-circle-74-77-once.cjs
      - name: Verify
        run: |
          git diff --check
          grep -F 'Final sub-threshold tuning' circle/a4-utilization.css
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add circle/a4-utilization.css
          git commit -m 'Tune final Circle A4 threshold outliers'
          git push origin HEAD:fix/circle-utilization-150-lock
