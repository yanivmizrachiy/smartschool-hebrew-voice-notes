name: Apply circle name/date cleanup once

on:
  push:
    branches:
      - fix/circle-no-name-date-a4-utilization
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/circle-no-name-date-a4-utilization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply cleanup
        run: node tools/apply-circle-no-name-date.mjs
      - name: Verify cleanup
        run: |
          node circle/qa.mjs
          ! grep -R -n -E 'שם[[:space:]]*(התלמיד)?[[:space:]]*[:：]|תאריך[[:space:]]*[:：]' circle/page-*.html
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add circle/page-*.html circle/styles.css circle/qa.mjs
          git commit -m 'Remove name and date fields from all circle pages'
          git push origin HEAD:fix/circle-no-name-date-a4-utilization
