name: Update shared home contract once

on:
  push:
    branches: [agent/shared-home-redesign]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shared-home-redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Append canonical root-home contract to viewer source of truth
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'viewer/VIEWER_RULES.md';
          let text = fs.readFileSync(file, 'utf8');
          const heading = '## 5א. דף הבית המשותף — ללא ברירת מחדל לנושא';
          if (text.includes(heading)) {
            console.log('Shared-home source-of-truth section already present.');
            process.exit(0);
          }
          const marker = '## 6. הדפסה';
          if (!text.includes(marker)) throw new Error('Expected VIEWER_RULES print-section marker not found; refusing broad edit');
          const section = `${heading}\n\n- כתובת השורש ללא \`?topic=\` היא דף בית/קטלוג משותף של שלוש החוברות: **מעגל, גליל וחרוט**.\n- אין נושא ברירת מחדל. בפרט, אין לפתוח חרוט אוטומטית כאשר המשתמש נכנס לכתובת הראשית.\n- דף הבית מציג את הספירות המאומתות: מעגל 88, גליל 38, חרוט 46 — סך הכול 172 דפי A4.\n- לפני בחירת נושא אין לטעון \`viewer/app.js\` ואין ליצור \`iframe\` של דפי חוברת; הטעינה מתבצעת רק לאחר בחירה באמצעות \`viewer/bootstrap.js\`.\n- כל כרטיס/כפתור כניסה לנושא פותח במפורש את דף 1 באמצעות \`?topic=<topic>&sheet=1#workbook\`.\n- דף הבית נשאר גלוי, מלא ונוח גם בטלפון; כללי mobile שמסתירים chrome חלים רק לאחר שנבחר נושא ונכנסים למצב חוברת.\n- שלוש החוברות מוצגות כשוות־מעמד בעמוד הבית; אין מיתוג או היררכיה שמציגים אחת מהן כפרויקט הראשי והאחרות כתוספת.\n\n`;
          text = text.replace(marker, `${section}${marker}`);
          fs.writeFileSync(file, text);
          NODE
      - name: Verify only viewer source of truth changed
        run: |
          git diff --check
          test "$(git diff --name-only)" = "viewer/VIEWER_RULES.md"
          grep -F 'דף הבית המשותף' viewer/VIEWER_RULES.md
          grep -F 'אין נושא ברירת מחדל' viewer/VIEWER_RULES.md
          grep -F 'סך הכול 172 דפי A4' viewer/VIEWER_RULES.md
      - name: Commit canonical shared-home source-of-truth rules
        run: |
          if git diff --quiet -- viewer/VIEWER_RULES.md; then
            echo 'No source-of-truth changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer/VIEWER_RULES.md
          git commit -m 'Lock shared workbook home in viewer source of truth'
          git push origin HEAD:agent/shared-home-redesign
