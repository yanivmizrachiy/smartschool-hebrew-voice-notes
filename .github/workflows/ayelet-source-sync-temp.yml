name: Ayelet exact source sync temp

on:
  push:
    branches:
      - gpt/ayelet-source-render-lock-v2

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/ayelet-source-render-lock-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate and regenerate print bundle
        run: npm run check
      - name: Commit generated print bundle and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add print/harut-a4.html print/styles.css print/assets/ayelet-original-cone.png
          git rm .github/workflows/ayelet-source-sync-temp.yml
          git commit -m "Regenerate print bundle with exact Ayelet source asset"
          git push origin HEAD:gpt/ayelet-source-render-lock-v2
