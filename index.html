<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123c7c">
  <title>הכתבה בעברית להערות מעקב לסמרטקול</title>
  <meta name="description" content="כלי הכתבה בעברית להערות מעקב: התקנה במכשיר, דיבור, פיסוק עברי אוטומטי והעתקה.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="manager-banner">האתר מנוהל על ידי הנברז</div>

  <main class="app-shell">
    <section class="hero-card">
      <h1>הכתבה בעברית להערות מעקב לסמרטקול</h1>

      <section class="install-panel install-only" id="installPanel" hidden>
        <button class="install-button" type="button" onclick="installApp()" id="installBtn">התקן במכשיר שלך</button>
      </section>

      <div class="main-actions">
        <button class="btn primary" onclick="startDictation()">🎙️ התחל הכתבה</button>
        <button class="btn soft" onclick="stopDictation()">עצור</button>
        <button class="btn success" onclick="copyText()">העתק להדבקה</button>
      </div>

      <textarea id="txt" aria-label="אזור טקסט להכתבה בעברית"></textarea>
      <div class="interim" id="interim" aria-live="polite"></div>
      <div class="status-panel" id="status" aria-live="polite" hidden></div>
      <div class="quality-box" id="qualityBox" aria-live="polite" hidden></div>

      <div class="tool-grid">
        <button class="chip" onclick="addText('. ')">נקודה</button>
        <button class="chip" onclick="addText(', ')">פסיק</button>
        <button class="chip" onclick="addText('? ')">סימן שאלה</button>
        <button class="chip" onclick="addText('\n')">שורה חדשה</button>
        <button class="chip" onclick="restoreDraft()">שחזר טיוטה</button>
        <button class="chip danger" onclick="clearText()">נקה</button>
      </div>
    </section>
  </main>

  <nav class="mobile-bar">
    <button class="install-only" onclick="installApp()">⬇️ התקן</button>
    <button onclick="startDictation()">🎙️ דבר</button>
    <button onclick="copyText()">📋 העתק</button>
  </nav>

  <script src="script.js"></script>
</body>
</html>
