<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="חרוט — אפליקציית דפדוף, הורדה והדפסה לכל דפי ה-A4 של החוברת">
  <title>חרוט — דפדוף, הורדה והדפסה</title>
  <link rel="stylesheet" href="viewer/viewer.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div id="workbook-summary" class="brand-kicker">טוען את החוברת…</div>
      <h1>חרוט</h1>
    </div>
    <div class="header-actions">
      <button id="print-current" class="btn btn-secondary" type="button">הדפס / שמור PDF</button>
      <button id="print-current-bw" class="btn btn-secondary" type="button">הדפס דף בשחור־לבן</button>
      <a id="download-current" class="btn btn-secondary" href="#" download>הורד דף</a>
      <a id="open-current" class="btn btn-secondary" href="#" target="_blank" rel="noopener">פתח דף מלא</a>
      <a class="btn btn-primary" href="print.html" target="_blank" rel="noopener">הדפס את כל החוברת</a>
      <a class="btn btn-secondary" href="print.html?bw=1" target="_blank" rel="noopener">כל החוברת בשחור־לבן</a>
    </div>
  </header>

  <main class="app-shell">
    <section class="toolbar" aria-label="ניווט בין דפי החוברת">
      <button id="prev-page" class="nav-button" type="button" aria-label="העמוד הקודם">הקודם</button>
      <div class="page-picker-wrap">
        <label for="page-picker">דף</label>
        <select id="page-picker" aria-label="בחירת דף"></select>
        <span id="page-status" class="page-status"></span>
      </div>
      <button id="next-page" class="nav-button" type="button" aria-label="העמוד הבא">הבא</button>
    </section>

    <section class="current-sheet" aria-live="polite">
      <div>
        <div id="sheet-kind" class="sheet-kind"></div>
        <h2 id="sheet-title">טוען…</h2>
        <p id="sheet-subtitle"></p>
      </div>
      <div class="current-hint">חצים במקלדת: דפדוף מהיר</div>
    </section>

    <section class="viewer-card" id="viewer-card">
      <div id="loading" class="loading">טוען את הדף…</div>
      <iframe id="worksheet-frame" title="דף A4" loading="eager"></iframe>
    </section>

    <details class="page-catalog">
      <summary>כל 46 הדפים — מעבר מהיר והורדה</summary>
      <div id="page-grid" class="page-grid"></div>
    </details>
  </main>

  <footer class="app-footer">
    <span>יניב רז - מדריך מחוזי חט"ב בעיר ירושלים</span>
    <span>הדרכה במחוז ירושלים והעיר ירושלים - מנח"י, בהובלת איילת קריספין</span>
  </footer>

  <script type="module" src="viewer/app.js"></script>
</body>
</html>
