<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1224">
  <title>הכתבה בעברית להערות מעקב לסמרטקול</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css?v=buttons-clear-20260508-150512">
</head>
<body>
  <div class="manager-banner">האתר מנוהל ע"י יניב רז</div>

  <main class="app-shell">
    <section class="hero-card">
      <h1>הכתבה בעברית להערות מעקב לסמרטקול</h1>

      <section class="install-panel install-only" id="installPanel" hidden>
        <button class="install-button" type="button" onclick="installApp()" id="installBtn">התקן במכשיר שלך</button>
      </section>

      <div class="main-actions" aria-label="פעולות עיקריות">
        <button class="btn talk" onclick="startDictation()">🎙️ דבר</button>
        <button class="btn stop" onclick="stopDictation()" aria-label="עצירת הכתבה">⏸ עצור</button>
        <button class="btn copy" onclick="copyText()">📋 העתק</button>
      </div>
      <div class="copy-note" id="copyNote" aria-live="polite" hidden></div>

      <textarea id="txt" aria-label="אזור טקסט להכתבה בעברית"></textarea>
      <div class="interim" id="interim" aria-live="polite"></div>
      <div class="status-panel" id="status" aria-live="polite" hidden></div>
      <div class="quality-box" id="qualityBox" aria-live="polite" hidden></div>

      <div class="tool-grid" aria-label="פעולות טקסט">
        <button class="chip restore" onclick="restoreDraft()">שחזר טיוטה</button>
        <button class="clear-big" onclick="clearText()" aria-label="ניקוי כל הטקסט">🧹 נקה הכל</button>
      </div>
    </section>
  </main>

  <script src="script.js?v=smart-punct-20260508-174506"></script>
</body>
</html>
